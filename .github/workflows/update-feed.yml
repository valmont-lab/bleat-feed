# Save this file as .github/workflows/update-feed.yml in a new repo
# containing generate_feed.py. It runs the scraper daily and commits
# the updated feed.xml + state.json back to the repo. Combine with
# GitHub Pages (Settings > Pages > Deploy from branch) to get a live
# URL like https://<you>.github.io/<repo>/feed.xml

name: Update Bleat RSS feed

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily — adjust to taste
  workflow_dispatch: {}     # lets you trigger it manually too

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python generate_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json
          git diff --cached --quiet || git commit -m "Update feed"
          git push
